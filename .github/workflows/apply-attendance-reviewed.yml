name: Apply Attendance Reviewed Status

on:
  push:
    branches:
      - feature/attendance-reviewed-button

permissions:
  contents: write

jobs:
  patch-validate-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/attendance-reviewed-button
          fetch-depth: 0

      - name: Apply requested change
        run: python3 scripts/apply_attendance_reviewed.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Flutter
        run: flutter analyze

      - name: Build web
        run: flutter build web --release

      - name: Validate Worker JavaScript
        run: node --check worker/attendance.js

      - name: Check diff
        run: git diff --check

      - name: Commit validated source
        shell: bash
        run: |
          git config user.name "farshoffs"
          git config user.email "farshoffs@gmail.com"
          git add migrations/0014_attendance_reviewed.sql worker/attendance.js lib/core/api/api_service.dart lib/features/admin/attendance_history_screen.dart
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "Add attendance reviewed status"
          git push origin feature/attendance-reviewed-button
