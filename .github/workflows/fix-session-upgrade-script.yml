name: Fix Patrol Schedule Upgrade Script

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-session-upgrade-script.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make start-session replacement specific
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('scripts/apply_session_schedule_upgrade.py')
          t = p.read_text()
          old = '''t = once(\n    t,\n    "currentSessionIndex(now, interval)",\n    "currentSessionIndex(now, interval, auth.user.session_start_minutes)",\n    "start patrol session index",\n)'''
          new = '''if "currentSessionIndex(now, interval)" not in t:\n    raise RuntimeError("start patrol session index marker missing")\nt = t.replace(\n    "currentSessionIndex(now, interval)",\n    "currentSessionIndex(now, interval, auth.user.session_start_minutes)",\n    1,\n)'''
          if t.count(old) != 1:
              raise RuntimeError(f'expected one script selector block, got {t.count(old)}')
          p.write_text(t.replace(old, new, 1))
          PY

      - name: Commit script fix
        shell: bash
        run: |
          git config user.name 'RimbaKawal Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/apply_session_schedule_upgrade.py
          git commit -m 'Fix patrol schedule upgrade selector'
          git push origin main
