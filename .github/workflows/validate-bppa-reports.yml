name: Validate BPPA Monthly Reports

on:
  push:
    branches:
      - feature/bppa-monthly-reports

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter build web --release
      - run: node --check worker/reports.js
      - run: node --check worker/attendance.js
      - run: git diff --check HEAD~4..HEAD || git diff --check
