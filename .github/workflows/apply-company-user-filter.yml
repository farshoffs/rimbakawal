name: Apply Company User Filter

on:
  push:
    branches:
      - main
    paths:
      - scripts/apply_company_user_filter.py
      - .github/workflows/apply-company-user-filter.yml
  workflow_dispatch:

concurrency:
  group: apply-company-user-filter
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply company filter patch
        run: python scripts/apply_company_user_filter.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format updated screen
        run: dart format lib/features/admin/user_maintenance_screen.dart

      - name: Analyze Flutter code
        run: flutter analyze

      - name: Check diff
        run: git diff --check

      - name: Commit company filter
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/admin/user_maintenance_screen.dart
          git commit -m "Add company filter to company users"
          git pull --rebase origin main
          git push origin HEAD:main
