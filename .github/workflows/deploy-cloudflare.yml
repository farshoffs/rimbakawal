name: Deploy RimbaKawal to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: rimbakawal-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze Flutter code
        run: flutter analyze

      - name: Build Flutter web app
        run: flutter build web --release --dart-define=USE_MOCK_NFC=true

      - name: Install pinned Wrangler
        run: npm ci

      - name: Verify Wrangler version
        run: npx wrangler --version

      - name: Ensure D1 database exists
        shell: bash
        run: |
          set -euo pipefail
          DB_ID="$(npx wrangler d1 list --json | node -e '
            let input = "";
            process.stdin.on("data", (d) => input += d);
            process.stdin.on("end", () => {
              const items = JSON.parse(input);
              const db = items.find((item) => item.name === "rimbakawal-db");
              if (db) process.stdout.write(db.uuid || db.id || db.database_id || "");
            });
          ')"

          if [ -z "$DB_ID" ]; then
            echo "Creating D1 database rimbakawal-db in APAC..."
            npx wrangler d1 create rimbakawal-db --location apac
            DB_ID="$(npx wrangler d1 list --json | node -e '
              let input = "";
              process.stdin.on("data", (d) => input += d);
              process.stdin.on("end", () => {
                const items = JSON.parse(input);
                const db = items.find((item) => item.name === "rimbakawal-db");
                if (db) process.stdout.write(db.uuid || db.id || db.database_id || "");
              });
            ')"
          fi

          if [ -z "$DB_ID" ]; then
            echo "Unable to resolve D1 database ID."
            exit 1
          fi

          echo "D1_DATABASE_ID=$DB_ID" >> "$GITHUB_ENV"
          echo "Using D1 database $DB_ID"

      - name: Generate production Wrangler config
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const config = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          config.d1_databases = [
            {
              binding: 'DB',
              database_name: 'rimbakawal-db',
              database_id: process.env.D1_DATABASE_ID,
              migrations_dir: 'migrations'
            }
          ];
          fs.writeFileSync('wrangler.deploy.jsonc', JSON.stringify(config, null, 2));
          NODE

      - name: Apply D1 migrations and seed users
        run: npx wrangler d1 migrations apply rimbakawal-db --remote --config wrangler.deploy.jsonc

      - name: Deploy Worker and static assets
        run: npx wrangler deploy --config wrangler.deploy.jsonc
