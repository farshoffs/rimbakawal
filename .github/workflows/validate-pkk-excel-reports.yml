name: Validate Strict PKK PDF Formats

on:
  push:
    branches:
      - main
    paths:
      - lib/features/admin/pkk_pdf_generator.dart
      - lib/features/admin/report_screen.dart
      - worker/reports.js
      - tool/pkk_pdf_reference_smoke.dart
      - scripts/fix_pkk_strict_visual_layout.py
      - pubspec.yaml
      - pubspec.lock
      - .github/workflows/validate-pkk-excel-reports.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply strict visual reference fixes
        run: python scripts/fix_pkk_strict_visual_layout.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Apply safe analyzer fixes
        run: |
          dart fix --apply
          dart format lib/features/admin/report_screen.dart lib/features/admin/pkk_pdf_generator.dart tool/pkk_pdf_reference_smoke.dart
          dart fix --apply

      - name: Format report sources
        run: dart format lib/features/admin/report_screen.dart lib/features/admin/pkk_pdf_generator.dart tool/pkk_pdf_reference_smoke.dart

      - name: Validate Worker JavaScript
        run: node --check worker/reports.js

      - name: Analyze Flutter code
        run: flutter analyze

      - name: Verify strict reference behavior
        shell: bash
        run: |
          set -euo pipefail
          grep -n "Jana PKK 2 (PDF)" lib/features/admin/report_screen.dart
          grep -n "Jana PKK 3 (PDF)" lib/features/admin/report_screen.dart
          grep -n "Jana PKK 4 (PDF)" lib/features/admin/report_screen.dart
          grep -n "Printing.sharePdf" lib/features/admin/report_screen.dart
          ! grep -n "file_saver" lib/features/admin/report_screen.dart
          ! grep -n "flutterExcel" lib/features/admin/report_screen.dart
          ! grep -n "excel:" pubspec.yaml
          ! grep -n "file_saver:" pubspec.yaml
          grep -n "1 JANUARI 2019" lib/features/admin/pkk_pdf_generator.dart
          grep -n "1 OKTOBER 2024" lib/features/admin/pkk_pdf_generator.dart
          grep -n "NAMA PEKERJA" lib/features/admin/pkk_pdf_generator.dart
          grep -n "Summarize" lib/features/admin/pkk_pdf_generator.dart
          grep -n "activeDays" lib/features/admin/pkk_pdf_generator.dart
          grep -n "Disediakan Oleh" lib/features/admin/pkk_pdf_generator.dart
          grep -n "Disemak Oleh" lib/features/admin/pkk_pdf_generator.dart
          grep -n "Disahkan Oleh" lib/features/admin/pkk_pdf_generator.dart
          grep -n "version: 0.5.8+24" pubspec.yaml
          grep -n "payload.guards" worker/reports.js
          grep -n "attendanceToEnd" worker/reports.js

      - name: Generate reference PDFs
        run: dart run tool/pkk_pdf_reference_smoke.dart

      - name: Verify generated reference PDFs
        shell: bash
        run: |
          set -euo pipefail
          test -s build/pkk-reference/PKK_2_REFERENCE.pdf
          test -s build/pkk-reference/PKK_3_REFERENCE.pdf
          test -s build/pkk-reference/PKK_4_REFERENCE.pdf
          file build/pkk-reference/*.pdf

      - name: Upload reference PDFs
        uses: actions/upload-artifact@v4
        with:
          name: RimbaKawal-PKK-Strict-Reference-PDFs
          path: build/pkk-reference/*.pdf
          if-no-files-found: error
          retention-days: 7

      - name: Check diff
        run: git diff --check

      - name: Commit validated fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/admin/report_screen.dart lib/features/admin/pkk_pdf_generator.dart tool/pkk_pdf_reference_smoke.dart pubspec.yaml pubspec.lock worker/reports.js
          if git diff --cached --quiet; then
            echo "No validation fixes to commit."
            exit 0
          fi
          git commit -m "Validate strict PKK PDF visual layout"
          git push
