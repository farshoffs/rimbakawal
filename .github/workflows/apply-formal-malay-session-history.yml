name: Apply Formal Malay Interface Cleanup

on:
  push:
    branches:
      - main
    paths:
      - scripts/fix_remaining_formal_malay.py
      - .github/workflows/apply-formal-malay-session-history.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply formal Malay cleanup
        run: python3 scripts/fix_remaining_formal_malay.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Flutter
        run: flutter analyze

      - name: Validate Worker JavaScript
        run: |
          node --check worker/index.js
          node --check worker/app.js
          node --check worker/offline.js
          node --check worker/push.js
          node --check worker/sos.js

      - name: Show changes
        run: git diff --stat && git diff --check

      - name: Commit validated cleanup
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib web worker
          git commit -m "Complete official Malay interface cleanup"
          git push origin HEAD:main
