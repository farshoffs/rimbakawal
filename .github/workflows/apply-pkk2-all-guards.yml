name: Apply PKK2 All Guards

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_pkk2_all_guards.py'
      - '.github/workflows/apply-pkk2-all-guards.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply PKK2 all-guards patch
        run: python scripts/apply_pkk2_all_guards.py

      - name: Normalize PKK guard clauses
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('lib/features/admin/pkk_pdf_generator.dart')
          text = path.read_text(encoding='utf-8')
          replacements = {
              "          if (earliest != null) slots[slot] = _hhmm(earliest);": """          if (earliest != null) {
            slots[slot] = _hhmm(earliest);
          }""",
              "            if (earliest == null || at.isBefore(earliest)) earliest = at;": """            if (earliest == null || at.isBefore(earliest)) {
              earliest = at;
            }""",
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 2:
                  raise SystemExit(f'Expected 2 occurrences, found {count}: {old}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format updated generator
        run: dart format lib/features/admin/pkk_pdf_generator.dart

      - name: Analyze Flutter code
        run: flutter analyze

      - name: Check diff
        run: git diff --check

      - name: Commit PKK2 update
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/features/admin/pkk_pdf_generator.dart
          git commit -m 'Keep all guards together in PKK2'
          git pull --rebase origin main
          git push origin HEAD:main
