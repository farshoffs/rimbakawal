name: Validate Offline Engine v2

on:
  push:
    branches:
      - offline-v2

permissions:
  contents: write

concurrency:
  group: zpatrol-offline-v2
  cancel-in-progress: true

jobs:
  migrate-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: offline-v2

      - name: Apply Offline Engine v2
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply_offline_v2.py')
          t = p.read_text(encoding='utf-8')
          t = t.replace(
              '"    \'sessionIntervalMinutes\': user.sessionIntervalMinutes,\\n    \'active\': user.active,\\n",\n    "    \'sessionIntervalMinutes\': user.sessionIntervalMinutes,\\n"\n    "    \'sessionStartMinutes\': user.sessionStartMinutes,\\n"\n    "    \'noPk\': user.noPk,\\n"',
              '"    \'sessionStartMinutes\': user.sessionStartMinutes,\\n    \'active\': user.active,\\n",\n    "    \'sessionStartMinutes\': user.sessionStartMinutes,\\n"\n    "    \'noPk\': user.noPk,\\n"',
          )
          p.write_text(t, encoding='utf-8')
          PY
          python3 scripts/apply_offline_v2.py

      - name: Check worker JavaScript
        run: node --check worker/offline.js

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format Dart
        run: dart format lib

      - name: Commit generated implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib worker pubspec.yaml pubspec.lock release
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Implement Offline Engine v2"
            git push origin HEAD:offline-v2
          fi

      - name: Analyze Flutter
        run: flutter analyze

      - name: Build web release
        run: flutter build web --release --dart-define=USE_MOCK_NFC=true
