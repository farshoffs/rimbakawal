name: Apply Company Archive Night Shift

on:
  push:
    branches:
      - fix/company-report-nightshift-20260913
    paths:
      - scripts/apply_company_archive_nightshift.py
      - scripts/apply_pkk_compiled_report.py
      - scripts/apply_archive_shift_hardening.py
      - .github/workflows/apply-company-archive-nightshift.yml
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/company-report-nightshift-20260913

      - name: Apply company/archive/night-shift patch
        run: python3 scripts/apply_company_archive_nightshift.py

      - name: Apply compiled PKK report patch
        run: python3 scripts/apply_pkk_compiled_report.py

      - name: Apply hardening patch
        run: python3 scripts/apply_archive_shift_hardening.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Flutter
        run: flutter analyze

      - name: Validate Worker JavaScript
        run: |
          node --check worker/company_management.js
          node --check worker/reports.js
          node --check worker/attendance.js

      - name: Validate patch formatting
        run: git diff --check

      - name: Commit validated changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib worker migrations
          git commit -m "Harden archive scope and overnight shifts"
          git pull --rebase origin fix/company-report-nightshift-20260913
          git push origin HEAD:fix/company-report-nightshift-20260913
