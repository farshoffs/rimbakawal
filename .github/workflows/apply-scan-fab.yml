name: Apply Scan Floating Button

on:
  push:
    branches:
      - main
    paths:
      - scripts/move_scan_to_fab.py
      - .github/workflows/apply-scan-fab.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply scan floating button patch
        run: python3 scripts/move_scan_to_fab.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze Flutter code
        run: flutter analyze

      - name: Check diff
        run: git diff --check

      - name: Commit validated UI change
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- lib/features/patrol/patrol_screen.dart; then
            echo 'No patrol UI changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/features/patrol/patrol_screen.dart
          git commit -m 'Move checkpoint scan to yellow floating button'
          git push origin HEAD:main
