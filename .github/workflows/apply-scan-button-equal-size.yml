name: Apply Equal Checkpoint Scan Button

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-scan-button-equal-size.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Match scan button size to finish patrol
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/features/patrol/patrol_screen.dart')
          text = path.read_text(encoding='utf-8')
          old = """      floatingActionButtonLocation: FloatingActionButtonLocation.centerFloat,
      floatingActionButton: SizedBox(
        width: 270,
        height: 62,
        child: FloatingActionButton.extended(
"""
          new = """      floatingActionButtonLocation: FloatingActionButtonLocation.centerFloat,
      floatingActionButton: SizedBox(
        width: MediaQuery.sizeOf(context).width - 32,
        height: 66,
        child: FloatingActionButton.extended(
"""
          if old not in text:
              raise SystemExit('Scan button size marker not found')
          text = text.replace(old, new, 1)
          text = text.replace(
              "borderRadius: BorderRadius.circular(20),",
              "borderRadius: BorderRadius.circular(18),",
              1,
          )
          old_icon = """          icon: Icon(
            _scanning ? Icons.radar_rounded : Icons.nfc_rounded,
            size: 28,
          ),
"""
          new_icon = """          icon: Icon(
            _scanning ? Icons.radar_rounded : Icons.nfc_rounded,
            size: 30,
          ),
"""
          if old_icon not in text:
              raise SystemExit('Scan button icon marker not found')
          text = text.replace(old_icon, new_icon, 1)
          old_font = """            style: const TextStyle(
              fontSize: 16,
              fontWeight: FontWeight.w900,
"""
          new_font = """            style: const TextStyle(
              fontSize: 18,
              fontWeight: FontWeight.w900,
"""
          if old_font not in text:
              raise SystemExit('Scan button font marker not found')
          text = text.replace(old_font, new_font, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Flutter code
        run: flutter analyze

      - name: Check diff
        run: git diff --check

      - name: Commit validated button update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/patrol/patrol_screen.dart
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Match checkpoint scan button to finish patrol"
          git push origin main
