name: Apply Notification System V2

on:
  push:
    branches:
      - notification-upgrade-v0512
    paths:
      - scripts/apply_notification_system_v2.py
      - .github/workflows/apply-notification-system-v2.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: notification-upgrade-v0512

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply upgrade
        run: |
          python3 scripts/apply_notification_system_v2.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/core/notifications/notification_service.dart')
          text = p.read_text(encoding='utf-8')
          replacements = {
              "    if (!hasCommon) return false;": "    if (!hasCommon) {\n      return false;\n    }",
              "    if (kIsWeb) return _firebaseWebAppId.isNotEmpty && _firebaseWebVapidKey.isNotEmpty;": "    if (kIsWeb) {\n      return _firebaseWebAppId.isNotEmpty && _firebaseWebVapidKey.isNotEmpty;\n    }",
              "    if (_ready || _initializing || !PushConfig.isConfigured) return;": "    if (_ready || _initializing || !PushConfig.isConfigured) {\n      return;\n    }",
              "        if (user != null) unawaited(_registerToken(user, token));": "        if (user != null) {\n          unawaited(_registerToken(user, token));\n        }",
              "    if (!_ready) return false;": "    if (!_ready) {\n      return false;\n    }",
              "      if (!_isGranted(settings.authorizationStatus)) return false;": "      if (!_isGranted(settings.authorizationStatus)) {\n        return false;\n      }",
              "      if (token == null || token.isEmpty) return false;": "      if (token == null || token.isEmpty) {\n        return false;\n      }",
              "    if (pending == null || _user == null) return;": "    if (pending == null || _user == null) {\n      return;\n    }",
              "      if (_ready) await FirebaseMessaging.instance.deleteToken();": "      if (_ready) {\n        await FirebaseMessaging.instance.deleteToken();\n      }",
              "    if (kIsWeb) return 'web';": "    if (kIsWeb) {\n      return 'web';\n    }",
              "    if (defaultTargetPlatform == TargetPlatform.iOS) return 'ios';": "    if (defaultTargetPlatform == TargetPlatform.iOS) {\n      return 'ios';\n    }",
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          p.write_text(text, encoding='utf-8')
          PY

      - name: Format Dart
        run: dart format lib/core/notifications/notification_service.dart lib/core/notifications/notification_alert_gate.dart lib/features/auth/login_screen.dart lib/features/dashboard/dashboard_screen.dart

      - name: Validate JavaScript
        run: |
          node --check worker/push.js
          node --check worker/offline.js
          node --check worker/attendance.js
          node --check worker/sos.js

      - name: Validate Flutter
        run: |
          flutter pub get
          flutter analyze

      - name: Validate notification upgrade markers
        run: |
          grep -q "version: 0.5.12+28" pubspec.yaml
          grep -q "getInitialMessage" lib/core/notifications/notification_service.dart
          grep -q "openedAlerts" lib/core/notifications/notification_service.dart
          grep -q "MULA RONDAAN" lib/core/notifications/notification_alert_gate.dart
          grep -q "patrol_not_started" worker/push.js
          grep -q "session_ending" worker/push.js
          grep -q "session_missed" worker/push.js
          grep -q "checkpoint_scanned" worker/offline.js
          grep -q "patrol_completed" worker/offline.js
          grep -q "attendance_punch" worker/attendance.js
          grep -q "attendance_review" worker/attendance.js
          grep -q "aps-environment" mobile/ios/APNS_ENTITLEMENT_TEMPLATE.plist
          if grep -q "aps-environment" mobile/ios/Runner.entitlements; then
            echo "APNs entitlement must remain inactive until Apple Developer Program is ready."
            exit 1
          fi

      - name: Commit validated upgrade
        run: |
          if git diff --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib worker mobile/ios docs pubspec.yaml
          git commit -m "Upgrade RimbaKawal push notifications and deep links"
          git push origin HEAD:notification-upgrade-v0512
