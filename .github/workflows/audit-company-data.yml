name: Audit Existing Company Data

on:
  push:
    branches:
      - company-data-audit-20260911
    paths:
      - '.github/workflows/audit-company-data.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Wrangler
        run: npm ci
      - name: Query existing unlinked records
        shell: bash
        run: |
          {
            echo '=== ACTIVE SCHOOLS WITHOUT COMPANY ==='
            npx wrangler d1 execute rimbakawal-db --remote --command "
              SELECT d.id, d.name AS school_name,
                     COALESCE(d.company_name, '') AS legacy_company_name,
                     COUNT(u.id) AS user_count
              FROM departments d
              LEFT JOIN users u ON u.department_id = d.id AND u.active = 1
              WHERE d.active = 1 AND d.company_id IS NULL
              GROUP BY d.id, d.name, d.company_name
              ORDER BY d.id;
            "
            echo '=== OPERATIONAL USERS WITHOUT COMPANY ==='
            npx wrangler d1 execute rimbakawal-db --remote --command "
              SELECT u.id, u.jawatan, u.department_id, d.name AS school_name
              FROM users u
              LEFT JOIN departments d ON d.id = u.department_id
              WHERE u.active = 1
                AND LOWER(u.jawatan) IN ('patrol','supervisor')
                AND u.department_id IS NOT NULL
                AND u.company_id IS NULL
              ORDER BY u.department_id, u.id;
            "
            echo '=== EXISTING COMPANY RELATIONSHIPS ==='
            npx wrangler d1 execute rimbakawal-db --remote --command "
              SELECT c.id, c.name,
                     COUNT(DISTINCT CASE WHEN d.active = 1 THEN d.id END) AS active_schools,
                     GROUP_CONCAT(DISTINCT CASE WHEN d.active = 1 THEN d.name END) AS school_names,
                     COUNT(DISTINCT CASE WHEN u.active = 1 AND LOWER(u.jawatan) = 'administration' THEN u.id END) AS active_company_admins
              FROM companies c
              LEFT JOIN departments d ON d.company_id = c.id
              LEFT JOIN users u ON u.company_id = c.id
              GROUP BY c.id, c.name
              ORDER BY c.id;
            "
          } > company-data-audit.txt
      - name: Upload audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: company-data-audit
          path: company-data-audit.txt
          retention-days: 1
