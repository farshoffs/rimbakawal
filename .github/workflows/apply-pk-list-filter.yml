name: Apply Senarai PK Management Filter

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-pk-list-filter.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Update PK list UI and filter management
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          user_file = Path('lib/features/admin/user_maintenance_screen.dart')
          text = user_file.read_text()

          replacements = {
              "final users = await widget.api.getAdminUsers();": "final users = (await widget.api.getAdminUsers())\n        .where((user) => !user.isManagement)\n        .toList();",
              "title: const Text('Senarai Pengguna'),": "title: const Text('Senarai PK'),",
              "'${filteredUsers.length} pengguna'": "'${filteredUsers.length} PK'",
              "child: Text('Tiada pengguna untuk Sekolah ini.'),": "child: Text('Tiada PK untuk Sekolah ini.'),",
              "label: const Text('Tambah Pengguna'),": "label: const Text('Tambah PK'),",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Missing expected user-list text: {old}')
              text = text.replace(old, new, 1)
          user_file.write_text(text)

          admin_file = Path('lib/features/admin/admin_screen.dart')
          text = admin_file.read_text()
          replacements = {
              "title: 'Senarai Pengguna',": "title: 'Senarai PK',",
              "subtitle: 'Tambah pengguna dan tetapkan Sekolah.',": "subtitle: 'Tambah PK dan tetapkan Sekolah.',",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Missing expected admin-menu text: {old}')
              text = text.replace(old, new, 1)
          admin_file.write_text(text)
          PY

      - name: Format changed Dart files
        run: dart format lib/features/admin/user_maintenance_screen.dart lib/features/admin/admin_screen.dart

      - name: Verify changes
        shell: bash
        run: |
          grep -q "Senarai PK" lib/features/admin/admin_screen.dart
          grep -q "Senarai PK" lib/features/admin/user_maintenance_screen.dart
          grep -q "!user.isManagement" lib/features/admin/user_maintenance_screen.dart
          grep -q "Tambah PK" lib/features/admin/user_maintenance_screen.dart

      - name: Remove one-time workflow and commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-pk-list-filter.yml
          git add lib/features/admin/user_maintenance_screen.dart lib/features/admin/admin_screen.dart
          git commit -m "Rename user list to PK and hide management"
          git push
