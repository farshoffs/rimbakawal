name: Build RimbaKawal Mobile Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: rimbakawal-mobile-production
  cancel-in-progress: true

permissions:
  contents: read

env:
  API_BASE_URL: https://rimbakawal.fscapitalmanagement.workers.dev
  FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
  FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
  FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
  FIREBASE_WEB_APP_ID: ${{ secrets.FIREBASE_WEB_APP_ID }}
  FIREBASE_ANDROID_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
  FIREBASE_IOS_APP_ID: ${{ secrets.FIREBASE_IOS_APP_ID }}
  FIREBASE_WEB_VAPID_KEY: ${{ secrets.FIREBASE_WEB_VAPID_KEY }}

jobs:
  android-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Android project
        run: bash scripts/prepare-mobile.sh "$RUNNER_TEMP/rimbakawal-mobile"

      - name: Build production APK
        working-directory: ${{ runner.temp }}/rimbakawal-mobile
        run: >-
          flutter build apk --release
          --dart-define=USE_MOCK_NFC=false
          --dart-define=API_BASE_URL=${{ env.API_BASE_URL }}
          --dart-define=FIREBASE_API_KEY=${{ env.FIREBASE_API_KEY }}
          --dart-define=FIREBASE_PROJECT_ID=${{ env.FIREBASE_PROJECT_ID }}
          --dart-define=FIREBASE_MESSAGING_SENDER_ID=${{ env.FIREBASE_MESSAGING_SENDER_ID }}
          --dart-define=FIREBASE_WEB_APP_ID=${{ env.FIREBASE_WEB_APP_ID }}
          --dart-define=FIREBASE_ANDROID_APP_ID=${{ env.FIREBASE_ANDROID_APP_ID }}
          --dart-define=FIREBASE_IOS_APP_ID=${{ env.FIREBASE_IOS_APP_ID }}
          --dart-define=FIREBASE_WEB_VAPID_KEY=${{ env.FIREBASE_WEB_VAPID_KEY }}

      - name: Build production app bundle
        working-directory: ${{ runner.temp }}/rimbakawal-mobile
        run: >-
          flutter build appbundle --release
          --dart-define=USE_MOCK_NFC=false
          --dart-define=API_BASE_URL=${{ env.API_BASE_URL }}
          --dart-define=FIREBASE_API_KEY=${{ env.FIREBASE_API_KEY }}
          --dart-define=FIREBASE_PROJECT_ID=${{ env.FIREBASE_PROJECT_ID }}
          --dart-define=FIREBASE_MESSAGING_SENDER_ID=${{ env.FIREBASE_MESSAGING_SENDER_ID }}
          --dart-define=FIREBASE_WEB_APP_ID=${{ env.FIREBASE_WEB_APP_ID }}
          --dart-define=FIREBASE_ANDROID_APP_ID=${{ env.FIREBASE_ANDROID_APP_ID }}
          --dart-define=FIREBASE_IOS_APP_ID=${{ env.FIREBASE_IOS_APP_ID }}
          --dart-define=FIREBASE_WEB_VAPID_KEY=${{ env.FIREBASE_WEB_VAPID_KEY }}

      - name: Upload Android release files
        uses: actions/upload-artifact@v4
        with:
          name: RimbaKawal-Android-Production
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ runner.temp }}/rimbakawal-mobile/build/app/outputs/flutter-apk/app-release.apk
            ${{ runner.temp }}/rimbakawal-mobile/build/app/outputs/bundle/release/app-release.aab

  ios-release-unsigned:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare iOS project
        run: bash scripts/prepare-mobile.sh "$RUNNER_TEMP/rimbakawal-mobile"

      - name: Build production iOS app without signing
        working-directory: ${{ runner.temp }}/rimbakawal-mobile
        run: >-
          flutter build ios --release --no-codesign
          --dart-define=USE_MOCK_NFC=false
          --dart-define=API_BASE_URL=${{ env.API_BASE_URL }}
          --dart-define=FIREBASE_API_KEY=${{ env.FIREBASE_API_KEY }}
          --dart-define=FIREBASE_PROJECT_ID=${{ env.FIREBASE_PROJECT_ID }}
          --dart-define=FIREBASE_MESSAGING_SENDER_ID=${{ env.FIREBASE_MESSAGING_SENDER_ID }}
          --dart-define=FIREBASE_WEB_APP_ID=${{ env.FIREBASE_WEB_APP_ID }}
          --dart-define=FIREBASE_ANDROID_APP_ID=${{ env.FIREBASE_ANDROID_APP_ID }}
          --dart-define=FIREBASE_IOS_APP_ID=${{ env.FIREBASE_IOS_APP_ID }}
          --dart-define=FIREBASE_WEB_VAPID_KEY=${{ env.FIREBASE_WEB_VAPID_KEY }}

      - name: Package unsigned iOS IPA
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/Payload"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$RUNNER_TEMP/rimbakawal-mobile/build/ios/iphoneos/Runner.app" "$RUNNER_TEMP/Payload/Runner.app"
          cd "$RUNNER_TEMP"
          zip -qry RimbaKawal-iOS-Production-Unsigned.ipa Payload

      - name: Upload iOS release file
        uses: actions/upload-artifact@v4
        with:
          name: RimbaKawal-iOS-Production-Unsigned
          if-no-files-found: error
          retention-days: 14
          path: ${{ runner.temp }}/RimbaKawal-iOS-Production-Unsigned.ipa
