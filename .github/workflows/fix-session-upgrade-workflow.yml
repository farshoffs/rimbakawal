name: Fix Patrol Schedule Upgrade Workflow

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-session-upgrade-workflow.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair upgrade workflow assertions
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/apply-session-schedule-upgrade.yml')
          text = path.read_text()
          lines = text.splitlines(True)

          def remove_once_call(label):
              global lines
              end = next((i for i, line in enumerate(lines) if f"'{label}')" in line), None)
              if end is None:
                  raise RuntimeError(f'label not found: {label}')
              start = None
              for i in range(end, -1, -1):
                  if lines[i].strip() == 't = once(t,':
                      start = i
                      break
              if start is None:
                  raise RuntimeError(f'call start not found: {label}')
              del lines[start:end + 1]

          remove_once_call('admin dept select')
          remove_once_call('command user start')
          text = ''.join(lines)

          old = 'return malaysiaDateKey(new Date(day.startMs + MALAYSIA_OFFSET_MS));'
          new = 'return malaysiaDateKey(new Date(day.startMs));'
          if text.count(old) != 1:
              raise RuntimeError(f'scheduleDateKey replacement expected once, got {text.count(old)}')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - name: Commit repaired workflow
        shell: bash
        run: |
          git config user.name 'RimbaKawal Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/workflows/apply-session-schedule-upgrade.yml
          git commit -m 'Repair patrol schedule upgrade workflow'
          git push origin main
