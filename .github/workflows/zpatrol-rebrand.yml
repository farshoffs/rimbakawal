name: Apply ZPatrol Rebrand

on:
  push:
    branches:
      - rebrand-zpatrol

permissions:
  contents: write

concurrency:
  group: zpatrol-rebrand
  cancel-in-progress: true

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out rebrand branch
        uses: actions/checkout@v4
        with:
          ref: rebrand-zpatrol

      - name: Apply ZPatrol rebrand
        run: python3 scripts/apply_zpatrol_rebrand.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format Dart sources
        run: dart format lib

      - name: Commit generated rebrand
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs lib worker web mobile pubspec.yaml pubspec.lock wrangler.jsonc scripts/cloudflare-build.sh setup_windows.ps1 assets/branding release
          if git diff --cached --quiet; then
            echo "No non-workflow rebrand changes to commit."
          else
            git commit -m "Rebrand RimbaKawal as ZPatrol"
            git push origin HEAD:rebrand-zpatrol
          fi

      - name: Analyze Flutter code
        run: flutter analyze

      - name: Build ZPatrol web release
        run: flutter build web --release --dart-define=USE_MOCK_NFC=true
