name: Capture Production Mobile Screenshots

on:
  push:
    branches:
      - chore/mobile-screen-snapshots
  workflow_dispatch:

permissions:
  contents: write

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  SNAPSHOT_IC: '991231999999'
  PRODUCTION_URL: 'https://rimbakawal.fscapitalmanagement.workers.dev'

jobs:
  capture:
    if: ${{ !contains(github.event.head_commit.message, 'Capture production mobile screenshots') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/mobile-screen-snapshots

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install project dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright@1.55.0 install --with-deps chromium

      - name: Create temporary production demo user
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute rimbakawal-db --remote --config wrangler.jsonc --command "DELETE FROM sessions WHERE user_id IN (SELECT id FROM users WHERE no_kad_pengenalan='${SNAPSHOT_IC}'); DELETE FROM users WHERE no_kad_pengenalan='${SNAPSHOT_IC}'; INSERT INTO users (nama, no_kad_pengenalan, jawatan, profile_picture, jabatan, active, department_id, no_pk) SELECT 'DEMO SNAPSHOT RIMBAKAWAL', '${SNAPSHOT_IC}', 'Management', NULL, d.name, 1, d.id, 'DEMO-001' FROM departments d WHERE d.active = 1 ORDER BY CASE WHEN LOWER(d.name) = 'pentadbiran' THEN 0 ELSE 1 END, d.id LIMIT 1;"

      - name: Capture mobile screens from production
        shell: bash
        run: |
          mkdir -p docs/screenshots/mobile
          cat > /tmp/capture-rimbakawal.mjs <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const baseUrl = process.env.PRODUCTION_URL;
          const identity = process.env.SNAPSHOT_IC;
          const output = 'docs/screenshots/mobile';
          fs.mkdirSync(output, { recursive: true });

          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({
            viewport: { width: 430, height: 932 },
            deviceScaleFactor: 1,
            isMobile: true,
            hasTouch: true,
            locale: 'ms-MY',
            timezoneId: 'Asia/Kuala_Lumpur',
            geolocation: { latitude: 5.6958204, longitude: 100.5371980 },
            permissions: ['geolocation'],
          });
          const page = await context.newPage();
          page.setDefaultTimeout(12000);

          const wait = (ms = 1400) => page.waitForTimeout(ms);

          async function enableSemantics() {
            try {
              const roleButton = page.getByRole('button', { name: /Enable accessibility/i });
              if (await roleButton.count()) {
                await roleButton.first().click({ timeout: 1500 });
                await wait(400);
              }
            } catch (_) {}
            try {
              const placeholder = page.locator('flt-semantics-placeholder');
              if (await placeholder.count()) {
                await placeholder.first().click({ timeout: 1500 });
                await wait(400);
              }
            } catch (_) {}
          }

          async function snap(name, delay = 1400) {
            await wait(delay);
            await page.screenshot({ path: `${output}/${name}.png`, fullPage: false });
            console.log(`Captured ${name}`);
          }

          async function visibleText(text) {
            await enableSemantics();
            const exact = page.getByText(text, { exact: true });
            if (await exact.count()) return exact.first();
            const loose = page.getByText(text);
            if (await loose.count()) return loose.first();
            return null;
          }

          async function tapText(text, fallback = null) {
            const locator = await visibleText(text);
            if (locator) {
              try { await locator.scrollIntoViewIfNeeded(); } catch (_) {}
              await locator.click({ timeout: 7000 });
              await wait();
              return true;
            }
            if (fallback) {
              await page.mouse.click(fallback.x, fallback.y);
              await wait();
              return true;
            }
            console.warn(`Could not find text: ${text}`);
            return false;
          }

          async function back() {
            await enableSemantics();
            try {
              const backButton = page.getByRole('button', { name: /Back|Kembali/i });
              if (await backButton.count()) {
                await backButton.first().click({ timeout: 2500 });
                await wait();
                return;
              }
            } catch (_) {}
            await page.mouse.click(28, 55);
            await wait();
          }

          async function captureRoute(text, name, fallback = null, delay = 1500) {
            if (await tapText(text, fallback)) {
              await snap(name, delay);
              await back();
            }
          }

          try {
            await page.goto(baseUrl, { waitUntil: 'domcontentloaded', timeout: 60000 });
            await wait(5000);
            await enableSemantics();
            await snap('01-log-masuk', 400);

            let input = page.locator('input').first();
            if (await input.count()) {
              await input.fill(identity);
            } else {
              await page.mouse.click(215, 590);
              await page.keyboard.type(identity);
            }

            if (!(await tapText('Teruskan', { x: 215, y: 690 }))) {
              throw new Error('Login button not found');
            }
            await wait(4500);
            await enableSemantics();
            await snap('02-dashboard', 500);

            await captureRoute('Mula Rondaan', '03-mula-rondaan', { x: 115, y: 650 });
            await captureRoute('Kehadiran', '04-kehadiran', { x: 320, y: 650 });
            await captureRoute('Sejarah', '05-sejarah-rondaan', { x: 115, y: 820 }, 2600);
            await captureRoute('Profil', '06-profil', { x: 320, y: 820 });

            // Direct monitoring tile on Management dashboard.
            await captureRoute('Pemantauan', '07-pusat-pemantauan', null, 3200);

            // Management administration hub and each of its routes.
            const openedAdmin = await tapText('Pentadbiran');
            if (!openedAdmin) throw new Error('Pentadbiran tile not found');
            await snap('08-pentadbiran');

            const adminRoutes = [
              ['Peta Rondaan Langsung', '09-peta-rondaan-langsung', 3500],
              ['Pusat Pemantauan', '10-pusat-pemantauan-admin', 3500],
              ['Sejarah Kehadiran', '11-sejarah-kehadiran', 2600],
              ['Pengurusan SOS', '12-pengurusan-sos', 2200],
              ['Senarai Pengguna', '13-senarai-pengguna', 2200],
              ['Jabatan dan Checkpoint', '14-jabatan-checkpoint', 2800],
              ['Laporan', '15-laporan', 2200],
            ];

            for (const [label, filename, delay] of adminRoutes) {
              const ok = await tapText(label);
              if (!ok) {
                console.warn(`Skipping ${filename}`);
                continue;
              }
              await snap(filename, delay);

              if (label === 'Sejarah Kehadiran') {
                // Capture the first attendance detail dialog when production has records today.
                try {
                  const cards = page.locator('flt-semantics[role="button"]');
                  const count = await cards.count();
                  for (let i = 0; i < count; i++) {
                    const node = cards.nth(i);
                    const labelText = (await node.getAttribute('aria-label')) || '';
                    if (/MASUK|KELUAR/i.test(labelText) && !/tarikh/i.test(labelText)) {
                      await node.click();
                      await wait(1000);
                      const detail = await visibleText('Detail Kehadiran');
                      if (detail) {
                        await snap('11b-detail-kehadiran', 500);
                        await page.keyboard.press('Escape');
                        await wait(500);
                      }
                      break;
                    }
                  }
                } catch (error) {
                  console.warn(`Attendance detail skipped: ${error}`);
                }
              }

              await back();
            }
          } finally {
            await browser.close();
          }
          NODE
          npx -y -p playwright@1.55.0 node /tmp/capture-rimbakawal.mjs

      - name: Upload screenshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: rimbakawal-mobile-screenshots
          path: docs/screenshots/mobile/*.png
          if-no-files-found: error

      - name: Commit captured screenshots
        shell: bash
        run: |
          git config user.name farshoffs
          git config user.email farshoffs@gmail.com
          git add docs/screenshots/mobile
          git commit -m 'Capture production mobile screenshots'
          git push

      - name: Remove temporary production demo user
        if: always()
        shell: bash
        run: |
          npx wrangler d1 execute rimbakawal-db --remote --config wrangler.jsonc --command "DELETE FROM sessions WHERE user_id IN (SELECT id FROM users WHERE no_kad_pengenalan='${SNAPSHOT_IC}'); DELETE FROM users WHERE no_kad_pengenalan='${SNAPSHOT_IC}';" || true
