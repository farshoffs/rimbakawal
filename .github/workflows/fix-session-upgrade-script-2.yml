name: Fix Patrol Schedule Upgrade Script 2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-session-upgrade-script-2.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Split smart config and smart scan replacements
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('scripts/apply_session_schedule_upgrade.py')
          t = p.read_text()
          old = '''if t.count(old_block) != 2:\n    raise RuntimeError(f"smart session blocks: expected 2, got {t.count(old_block)}")\nt = t.replace(old_block, new_block)'''
          new = '''if t.count(old_block) != 1:\n    raise RuntimeError(f"smart config session block: expected 1, got {t.count(old_block)}")\nt = t.replace(old_block, new_block, 1)\nscan_old_block = """  const now = new Date();\n  const scannedAt = now.toISOString();\n  const interval = Number(department.session_interval_minutes || 120);\n  const day = malaysiaDayBounds(malaysiaDateKey(now));\n  const sessionIndex = currentSessionIndex(now, interval);\n  const sessionStart = day.startMs + sessionIndex * interval * 60000;\n  const sessionEnd = Math.min(day.endMs, sessionStart + interval * 60000);"""\nscan_new_block = """  const now = new Date();\n  const scannedAt = now.toISOString();\n  const interval = Number(department.session_interval_minutes || 120);\n  const window = sessionWindow(now, interval, department.session_start_minutes);\n  const sessionIndex = window.index;\n  const sessionStart = window.startMs;\n  const sessionEnd = window.endMs;"""\nif t.count(scan_old_block) != 1:\n    raise RuntimeError(f"smart scan session block: expected 1, got {t.count(scan_old_block)}")\nt = t.replace(scan_old_block, scan_new_block, 1)'''
          if t.count(old) != 1:
              raise RuntimeError(f'expected one combined smart block assertion, got {t.count(old)}')
          p.write_text(t.replace(old, new, 1))
          PY
      - name: Commit script fix
        shell: bash
        run: |
          git config user.name 'RimbaKawal Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/apply_session_schedule_upgrade.py
          git commit -m 'Split patrol config and scan schedule patches'
          git push origin main
